<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무기 디펜스</title>
<style>
:root{color-scheme:dark;--bg:#14161c;--card:#222633;--line:#363c4f;--tx:#eef0f6;--mut:#9aa1b5;--gold:#ffc83d;--acc:#e0533d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px;position:relative;z-index:1}
h1{margin:6px 0;font-size:26px}h2{font-size:15px;margin:16px 0 8px;color:var(--gold)}
.sub{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:center;font-size:13px;flex:1 1 130px;min-width:110px}
.card.sel{border-color:var(--gold);background:#2d2f3e}
.card svg.i{width:48px;height:48px}
.card small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.card button{margin-top:6px;padding:5px 10px;font-size:12px}
.pv{width:100%;border-radius:6px;display:block;margin-bottom:4px}
#maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{background:#444;color:#888;cursor:default}
button.alt{background:#3a4058}
.big{width:100%;padding:14px;font-size:18px;margin-top:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.top .sp{flex:1}
.coin{color:var(--gold);font-weight:700}
/* 로비 */
#home{max-width:440px;margin:0 auto;text-align:center;padding-top:10px}
#fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;opacity:.16}
#fl span{position:absolute;top:-90px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.04)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px #ffc83d66)}50%{filter:drop-shadow(0 0 18px #ffc83dcc)}}
.hero{width:230px;margin:0 auto;animation:sway 4s ease-in-out infinite,glow 3s ease-in-out infinite}
.ttl{font-size:40px;margin:0;letter-spacing:2px;background:linear-gradient(90deg,#ffc83d,#ff7043,#ffc83d);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stat{display:flex;gap:8px;justify-content:center;margin:12px 0 18px;flex-wrap:wrap}
.stat span{background:#ffffff12;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700}
.hb{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0;padding:14px 18px;text-align:left;border:2px solid var(--line);background:linear-gradient(135deg,#2b3045,#1d2130);transition:transform .15s,border-color .15s}
.hb:hover{transform:translateY(-3px);border-color:var(--gold)}
.hb.main{background:linear-gradient(135deg,#e0533d,#a8321f);border-color:#ff8a65}
.hb .hi{font-size:30px}.hb b{font-size:18px;display:block}.hb small{color:#ffffffb0;font-size:12px;font-weight:400}
.srow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:8px;margin-bottom:8px;flex-wrap:wrap}
.srow>b{width:110px;font-size:13px}
.chip{border:2px solid var(--line);border-radius:8px;padding:4px 6px;text-align:center;font-size:11px;cursor:pointer;min-width:84px;background:#1b1e29}
.chip.sel{border-color:var(--gold)}
.chip svg{width:44px;height:44px;display:block;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:8px}
#hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:700;margin-bottom:6px}
#hud .sp{flex:1}
.gm{display:flex;gap:8px;align-items:flex-start}
canvas{flex:1;min-width:0;width:100%;display:block;border-radius:10px;border:2px solid var(--line);touch-action:none}
#side{width:220px;flex:none;background:var(--card);border-radius:10px;padding:10px;font-size:13px;line-height:1.7}
#side svg{width:56px;height:56px}
#side button{width:100%;margin-top:6px}
#bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.slot{flex:1 1 90px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px;text-align:center;cursor:pointer;font-size:12px}
.slot.sel{border-color:var(--gold)}.slot.no{opacity:.45}
.slot svg{width:36px;height:36px;display:block;margin:0 auto}
@media(max-width:720px){.gm{flex-direction:column}#side{width:100%}.srow>b{width:100%}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
.ov>div{background:var(--card);padding:22px;border-radius:14px;text-align:center;max-width:520px}
.lwi{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700}.lwi svg{width:34px;height:34px}
button,.card,.chip,.slot{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.25) rotate(5deg);opacity:1}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.rv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;min-width:260px}
.rv svg{width:140px;height:140px;animation:pop .9s ease-out both;filter:drop-shadow(0 0 18px var(--rc))}
.rv .ray{position:absolute;top:-10px;width:300px;height:300px;background:repeating-conic-gradient(var(--rc) 0 8deg,transparent 8deg 20deg);opacity:.3;border-radius:50%;animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 15%,transparent 70%);mask:radial-gradient(circle,#000 15%,transparent 70%)}
.rng{width:100%}.set{min-width:260px;text-align:left}.set label{display:flex;flex-direction:column;gap:4px;margin:12px 0;font-size:14px}
.srow svg.i{width:44px;height:44px}
.tmap{position:relative;width:100%;height:520px;margin:6px 0;background:radial-gradient(circle at 8% 50%,#2a3a2a,transparent 55%),#181b24;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.tmap svg.ln{position:absolute;inset:0;width:100%;height:100%}
.tn{position:absolute;transform:translate(-50%,-50%);width:88px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;font-size:11px;cursor:pointer;line-height:1.35;z-index:2}
.tn b{display:block;font-size:12px}.tn small{display:block;color:var(--mut);font-size:10px}
.tn.on{border-color:#76ff03;box-shadow:0 0 10px #76ff0366}.tn.max{border-color:var(--gold);box-shadow:0 0 12px #ffc83d88}.tn.lock{opacity:.4;cursor:default}.tn.rw{width:100px;border-radius:50%;padding:12px 4px}.tn.rw svg{width:40px;height:40px}
.tn.root{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;border-color:#76ff03}
#ac,.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}#ac .srow{margin:0;flex-direction:column;align-items:flex-start}#ac .srow>b{width:auto}
@media(max-width:720px){button{padding:10px 12px}.wrap{padding:8px}.card{flex:1 1 100px;min-width:90px}#hud{gap:8px;font-size:14px}#hud button{padding:8px 10px;font-size:13px}#side{font-size:12px}.ttl{font-size:32px}.hero{width:180px}#bar .slot{flex:1 1 70px}h1{font-size:22px}}
.hide{display:none!important}
</style>
</head>
<body>
<div id="fl"></div>
<button id="mu" class="alt" style="position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:20;padding:6px 10px" onclick="setR()">⚙️</button>
<div class="wrap">

<div id="home">
  <div class="hero" id="hero"></div>
  <h1 class="ttl">무기 디펜스</h1>
  <div class="sub">수많은 무기로 몰려오는 적을 베어라</div>
  <div class="stat"><span>🪙 <b id="hc"></b></span><span>🏆 최고 웨이브 <b id="hb2"></b></span><span>🗡️ 보유 무기 <b id="hw"></b></span></div>
  <button class="hb main" onclick="show('stage')"><span class="hi">⚔️</span><span><b>게임 시작</b><small>맵과 난이도를 골라 출전</small></span></button>
  <button class="hb" onclick="show('loadout')"><span class="hi">🎒</span><span><b>로드아웃</b><small>출전 무기와 스킨 장착</small></span></button>
  <button class="hb" onclick="show('shop')"><span class="hi">🛒</span><span><b>상점</b><small>새 무기와 스킨 구매</small></span></button>
  <button class="hb" onclick="show('ach')"><span class="hi">🏆</span><span><b>업적</b><small>달성하고 코인 보상 받기</small></span></button>
  <button class="hb" onclick="show('tree')"><span class="hi">🌳</span><span><b>업그레이드 트리</b><small>영구 강화와 전용 무기</small></span></button>
  <button class="hb" onclick="show('quest')"><span class="hi">📜</span><span><b>일일 퀘스트</b><small>매일 새로 생기는 목표와 보상</small></span></button>
</div>

<div id="ach" class="hide"><div class="top"><button class="alt" onclick="show('home')">← 뒤로</button><h1>🏆 업적</h1></div><div id="ac"></div></div>
<div id="tree" class="hide"><div class="top"><button class="alt" onclick="show('home')">← 뒤로</button><h1>🌳 업그레이드 트리</h1><span class="sp"></span><span class="coin">🪙 <span class="cc"></span></span></div><div id="tr"></div></div>
<div id="quest" class="hide"><div class="top"><button class="alt" onclick="show('home')">← 뒤로</button><h1>📜 일일 퀘스트</h1><span class="sp"></span><span class="coin">🪙 <span class="cc"></span></span></div><div id="qs2"></div></div>
<div id="stage" class="hide">
  <div class="top"><button class="alt" onclick="show('home')">← 뒤로</button><h1>맵 · 난이도 선택</h1></div>
  <div class="tabs"><button id="md0" onclick="setMode(0)">일반</button><button id="md1" class="alt" onclick="setMode(1)">♾ 무한</button><button id="md2" class="alt" onclick="setMode(2)">⏱ 챌린지</button></div><div class="tabs" id="sptabs" style="margin-top:12px"><button id="sp0" onclick="setSp(0)">🗺️ 일반 맵</button><button id="sp1" class="alt" onclick="setSp(1)">⭐ 특별 맵</button></div><div class="row" id="maps"></div>
  <h2 id="dfh">🔥 난이도</h2><div class="row" id="diffs"></div><div id="modsec"></div>
  <h2>🎒 출전 무기</h2><div class="row" id="lo"></div>
  <button class="big" id="start">전투 시작!</button>
</div>

<div id="loadout" class="hide">
  <div class="top"><button class="alt" onclick="show('home')">← 뒤로</button><h1>로드아웃</h1><span class="sp"></span><span class="coin">🪙 <span class="cc"></span></span></div>
  <div class="sub">카드를 눌러 출전 무기 선택(최대 4개) · 🎨 스킨 버튼으로 스킨 구매/장착</div>
  <div id="lw"></div>
</div>

<div id="shop" class="hide">
  <div class="top"><button class="alt" onclick="show('home')">← 뒤로</button><h1>상점</h1><span class="sp"></span><span class="coin">🪙 <span class="cc"></span></span></div>
  <div class="tabs"><button id="t1" onclick="tab=0;shopR()">무기</button><button id="t2" class="alt" onclick="tab=1;shopR()">스킨 (보유 무기)</button><button id="t3" class="alt" onclick="tab=2;shopR()">진화 💎</button><button id="t4" class="alt" onclick="tab=3;shopR()">이벤트 🎉</button></div>
  <div id="sc"></div>
</div>

<div id="game" class="hide">
  <div id="hud">
    <span>❤️ <span id="lives"></span></span><span>💰 <span id="gold"></span></span><span>🌊 <span id="wave"></span></span>
    <span class="sp"></span>
    <button class="alt" id="spd">x1</button><button class="alt" id="auto">자동: OFF</button><button id="next">웨이브 시작</button><button class="alt" id="quit">나가기</button>
  </div>
  <div class="gm"><canvas id="cv" width="800" height="480"></canvas><div id="side"></div></div>
  <div id="bar"></div>
</div>
</div>
<div class="ov" id="over"><div><h1 id="ot"></h1><p id="od"></p><button id="ob">메인 메뉴로</button></div></div>
<div class="ov" id="skm" onclick="if(event.target==this)skc()"><div id="skmb"></div></div>
<div class="ov" id="pk"><div id="pkb"></div></div>
<div class="ov" id="st" onclick="if(event.target==this)this.style.display='none'"><div class="set" id="stb"></div></div>
<div class="ov" id="rv" onclick="this.style.display='none'"><div class="rv" id="rvb"></div></div>
<div class="ov" id="cf"><div><p id="cft" style="font-size:16px"></p><div class="row" style="justify-content:center"><button class="alt" id="cfn">취소</button><button id="cfy">확인</button></div></div></div>

<script>
// ---------- 무기 SVG: [몸체(손잡이), 움직이는 부품(날/머리), 부품 축 x, y] ----------

 bastard:['<rect x="14" y="43" width="36" height="5" rx="2" fill="#ffb300"/><rect x="29" y="48" width="6" height="11" fill="#4e342e"/><circle cx="32" cy="60" r="3" fill="#e53935"/>','<path d="M32 0 L38 10 L42 43 L22 43 L26 10Z" fill="#d1c4e9" stroke="#7e57c2"/><path d="M32 6 V43" stroke="#9575cd"/>',32,43],
 claymore:['<rect x="12" y="40" width="40" height="5" rx="2" fill="#8d6e63"/><rect x="29" y="45" width="6" height="14" fill="#4e342e"/><circle cx="32" cy="61" r="3" fill="#8d6e63"/>',`<path d="M32 0 L41 12 L41 40 L23 40 L23 12Z" ${BL}/><path d="M32 6 V40" stroke="#90a4ae"/>`,32,40],

 scythe:[SH,`<path d="M34 8 Q64 2 59 36 Q52 16 34 20Z" ${BL}/>`,34,18],
 spear:['<rect x="30" y="14" width="4" height="46" fill="#8d6e63"/><path d="M26 22 L38 22 L36 28 L28 28Z" fill="#e53935"/>','<path d="M32 0 L39 18 L25 18Z" fill="#eceff1" stroke="#78909c"/>',32,18],

 trident:['<rect x="30" y="26" width="4" height="34" fill="#8d6e63"/>',`<path d="M32 0 L35 18 L29 18Z" fill="#eceff1" stroke="#78909c"/><path d="M18 4 L22 4 L24 20 L32 24 L40 20 L42 4 L46 4 L44 26 L32 30 L20 26Z" ${BL}/>`,32,28],
 multi:['<rect x="28" y="40" width="8" height="20" rx="3" fill="#6d4c41"/><circle cx="32" cy="42" r="4" fill="#ffb300"/>',`<path d="M32 2 L37 12 L37 40 L27 40 L27 12Z" ${BL}/><g transform="rotate(-38 32 42)"><path d="M32 12 L37 40 L27 40Z" ${BL}/></g><g transform="rotate(38 32 42)"><path d="M32 14 Q52 12 50 30 L32 34Z" ${HD}/></g>`,32,42]

Object.assign(ART,{
 excal:['<rect x="12" y="40" width="40" height="5" rx="2" fill="#ffb300"/><circle cx="32" cy="42" r="3" fill="#e53935"/><rect x="29" y="45" width="6" height="14" fill="#4e342e"/><circle cx="32" cy="61" r="3" fill="#ffb300"/>',`<path d="M32 0 L41 12 L41 40 L23 40 L23 12Z" fill="#eceff1" stroke="#78909c"/><path d="M32 6 V38 M27 18 H37" stroke="#ffd54f" stroke-width="2.5"/>`,32,40],
 gungnir:['<rect x="30" y="14" width="4" height="46" fill="#ffb300"/><path d="M30 30 h4 M30 38 h4 M30 46 h4" stroke="#e53935" stroke-width="2"/>',`<path d="M32 0 L40 18 L32 14 L24 18Z" fill="#eceff1" stroke="#78909c"/><path d="M22 20 L32 30 L42 20" stroke="#ffd54f" fill="none" stroke-width="2.5"/>`,32,22],
 mjolnir:[SH,`<rect x="14" y="4" width="38" height="20" rx="3" ${HD}/><rect x="14" y="4" width="8" height="20" fill="#90a4ae"/><path d="M38 6 L30 14 L36 14 L30 22" stroke="#fff176" stroke-width="2.5" fill="none"/>`,33,14],
 kukri:[HILT,`<path d="M28 18 Q44 22 40 44 L30 44 Q34 30 28 18Z" ${BL}/>`,32,44],
 flail:['<rect x="30" y="28" width="5" height="32" fill="#6d4c41"/>',`<path d="M32.5 20 V29" stroke="#546e7a" stroke-width="2"/><circle cx="32.5" cy="12" r="9" ${HD}/><path d="M32.5 2 l2.5 4 h-5z M22 12 l4 -2.5 v5z M43 12 l-4 -2.5 v5z" fill="#90a4ae" stroke="#546e7a"/>`,32,28],
 guandao:['<rect x="30" y="30" width="4" height="30" fill="#8d6e63"/><circle cx="32" cy="62" r="2.5" fill="#ffb300"/>',`<path d="M34 0 Q58 4 54 28 L34 32Z" ${BL}/><rect x="28" y="28" width="8" height="5" rx="1" fill="#e53935"/>`,32,30]
});
Object.assign(ART,{
 sword2:[HILT,`<path d="M32 2 L37 12 L37 44 L27 44 L27 12Z" ${BL}/><path d="M32 8 V44" stroke="#90a4ae"/>`,32,44],
 katana:[HILT,`<path d="M33 0 L35 5 L35 44 L29 44 Q30 20 33 0Z" fill="#eceff1" stroke="#78909c"/><path d="M31 42 Q31.5 22 33 8" stroke="#90a4ae" fill="none"/>`,32,44],
 scimitar:[HILT,`<path d="M26 4 Q40 18 36 44 L28 44 Q30 22 26 4Z" ${BL}/>`,32,44],
 excal:['<path d="M14 40 Q32 34 50 40 L50 44 Q32 40 14 44Z" fill="#ffb300"/><circle cx="32" cy="40" r="4" fill="#40c4ff"/><rect x="29" y="44" width="6" height="14" fill="#4e342e"/><circle cx="32" cy="60" r="3" fill="#ffb300"/>',`<path d="M32 0 L36 8 L36 38 L28 38 L28 8Z" fill="#eceff1" stroke="#78909c"/><path d="M32 6 V36" stroke="#40c4ff" stroke-width="1.5"/>`,32,38],

// 인게임 단축키: U/Space = 강화, S = 판매, Esc = 선택 해제
document.addEventListener('keydown',e=>{
  if(!G||G.over||G.pause)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const k=e.key.toLowerCase();
  if((k==='u'||k===' ')&&G.sel){e.preventDefault();upg();}
  else if(k==='s'&&G.sel){e.preventDefault();sell();}
  else if(k==='escape'){G.sel=null;side();}
});
