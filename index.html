<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무기 디펜스</title>
<style>
:root{color-scheme:dark;--bg:#14161c;--card:#222633;--line:#363c4f;--tx:#eef0f6;--mut:#9aa1b5;--gold:#ffc83d;--acc:#e0533d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px;position:relative;z-index:1}
h1{margin:6px 0;font-size:26px}h2{font-size:15px;margin:16px 0 8px;color:var(--gold)}
.sub{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:center;font-size:13px;flex:1 1 130px;min-width:110px}
.card.sel{border-color:var(--gold);background:#2d2f3e}
.card svg.i{width:48px;height:48px}
.card small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.card button{margin-top:6px;padding:5px 10px;font-size:12px}
.pv{width:100%;border-radius:6px;display:block;margin-bottom:4px}
#maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{background:#444;color:#888;cursor:default}
button.alt{background:#3a4058}
.big{width:100%;padding:14px;font-size:18px;margin-top:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.top .sp{flex:1}
.coin{color:var(--gold);font-weight:700}
#home{max-width:440px;margin:0 auto;text-align:center;padding-top:10px}
#fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;opacity:.16}
body.dungeon-active #fl{opacity:.5}
#fl span{position:absolute;top:-90px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.04)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px #ffc83d66)}50%{filter:drop-shadow(0 0 18px #ffc83dcc)}}
.hero{width:230px;margin:0 auto;animation:sway 4s ease-in-out infinite,glow 3s ease-in-out infinite}
.ttl{font-size:40px;margin:0;letter-spacing:2px;background:linear-gradient(90deg,#ffc83d,#ff7043,#ffc83d);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stat{display:flex;gap:8px;justify-content:center;margin:12px 0 18px;flex-wrap:wrap}
.stat span{background:#ffffff12;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700}
.hb{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0;padding:14px 18px;text-align:left;border:2px solid var(--line);background:linear-gradient(135deg,#2b3045,#1d2130);transition:transform .15s,border-color .15s}
.hb:hover{transform:translateY(-3px);border-color:var(--gold)}
.hb.main{background:linear-gradient(135deg,#e0533d,#a8321f);border-color:#ff8a65}
.hb .hi{font-size:30px}.hb b{font-size:18px;display:block}.hb small{color:#ffffffb0;font-size:12px;font-weight:400}
.srow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:8px;margin-bottom:8px;flex-wrap:wrap}
.srow>b{width:110px;font-size:13px}
.chip{border:2px solid var(--line);border-radius:8px;padding:4px 6px;text-align:center;font-size:11px;cursor:pointer;min-width:84px;background:#1b1e29}
.chip.sel{border-color:var(--gold)}
.chip svg{width:44px;height:44px;display:block;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:8px}
#hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:700;margin-bottom:6px}
#hud .sp{flex:1}
.gm{display:flex;gap:8px;align-items:flex-start}
canvas{flex:1;min-width:0;width:100%;display:block;border-radius:10px;border:2px solid var(--line);touch-action:none}
#side{width:220px;flex:none;background:var(--card);border-radius:10px;padding:10px;font-size:13px;line-height:1.7}
#side svg{width:56px;height:56px}
#side button{width:100%;margin-top:6px}
#bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.slot{flex:1 1 90px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px;text-align:center;cursor:pointer;font-size:12px}
.slot.sel{border-color:var(--gold)}.slot.no{opacity:.45}
.slot svg{width:36px;height:36px;display:block;margin:0 auto}
@media(max-width:720px){.gm{flex-direction:column}#side{width:100%}.srow>b{width:100%}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
.ov>div{background:var(--card);padding:22px;border-radius:14px;text-align:center;max-width:520px}
.lwi{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700}.lwi svg{width:34px;height:34px}
button,.card,.chip,.slot{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.25) rotate(5deg);opacity:1}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.rv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;min-width:260px}
.rv svg{width:140px;height:140px;animation:pop .9s ease-out both;filter:drop-shadow(0 0 18px var(--rc))}
.rv .ray{position:absolute;top:-10px;width:300px;height:300px;background:repeating-conic-gradient(var(--rc) 0 8deg,transparent 8deg 20deg);opacity:.3;border-radius:50%;animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 15%,transparent 70%);mask:radial-gradient(circle,#000 15%,transparent 70%)}
.rng{width:100%}.set{min-width:260px;text-align:left}.set label{display:flex;flex-direction:column;gap:4px;margin:12px 0;font-size:14px}
.srow svg.i{width:44px;height:44px}
.tmap{position:relative;width:100%;height:520px;margin:6px 0;background:radial-gradient(circle at 8% 50%,#2a3a2a,transparent 55%),#181b24;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.tmap svg.ln{position:absolute;inset:0;width:100%;height:100%}
.tn{position:absolute;transform:translate(-50%,-50%);width:88px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;font-size:11px;cursor:pointer;line-height:1.35;z-index:2}
.tn b{display:block;font-size:12px}.tn small{display:block;color:var(--mut);font-size:10px}
.tn.on{border-color:#76ff03;box-shadow:0 0 10px #76ff0366}.tn.max{border-color:var(--gold);box-shadow:0 0 12px #ffc83d88}.tn.lock{opacity:.4;cursor:default}.tn.rw{width:100px;border-radius:50%;padding:12px 4px}.tn.rw svg{width:40px;height:40px}
.tn.root{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;border-color:#76ff03}
#ac,.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}#ac .srow{margin:0;flex-direction:column;align-items:flex-start}#ac .srow>b{width:auto}
@media(max-width:720px){button{padding:10px 12px}.wrap{padding:8px}.card{flex:1 1 100px;min-width:90px}#hud{gap:8px;font-size:14px}#hud button{padding:8px 10px;font-size:13px}#side{font-size:12px}.ttl{font-size:32px}.hero{width:180px}#bar .slot{flex:1 1 70px}h1{font-size:22px}}
/* ===== 시즌 보상 가로 스크롤 ===== */
#sn .srewards{
  display:flex;
  gap:10px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:8px 4px 14px;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}
#sn .srewards::-webkit-scrollbar{height:8px}
#sn .srewards::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#sn .srewards::-webkit-scrollbar-track{background:transparent}
#sn .sreward{
  flex:0 0 120px;
  scroll-snap-align:start;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:12px;
}
</style>
</head>
<body>
<p>파일 크기 제한으로 전체 업로드가 어렵습니다. 아래 다운로드 파일을 사용해 주세요.</p>
</body>
</html>
